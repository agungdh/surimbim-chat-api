name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go vet ./...

  build:
    runs-on: ubuntu-latest
    needs: vet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o surimbim-chat-api .
      - uses: actions/upload-artifact@v5
        with:
          name: surimbim-chat-api
          path: surimbim-chat-api

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: surimbim-chat-api
      - uses: softprops/action-gh-release@v2
        with:
          files: surimbim-chat-api
