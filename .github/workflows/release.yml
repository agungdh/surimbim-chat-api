name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o surimbim-chat-api .
      - uses: softprops/action-gh-release@v2
        with:
          files: surimbim-chat-api
